name: Post Rules
on: workflow_dispatch
jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Send rules to Discord
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          curl -fsS -X POST -H "Content-Type: application/json" \
            -d @rules.json "$WEBHOOK"
